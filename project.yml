name: Reader

options:
  bundleIdPrefix: com.tirthajyoti
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Build configurations. Staging is a release-optimized build with a *separate app
# identity* (bundle id / name / icon) so it installs and runs alongside production
# without touching its prefs, TCC grants, or Launch Services default-handler slot.
# Debug/Release/Staging all exist for every target.
configs:
  Debug: debug
  Release: release
  Staging: release

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Local-only ad-hoc signing (no Apple Developer team required).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "NO"

targets:
  Reader:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: WebResources
        type: folder            # folder reference → ./vendor and ./fonts survive intact
      - path: Reader.icns          # production icon (scripts/make-icon.sh)
      - path: Reader-Staging.icns  # staging "Canary" icon (scripts/make-icon.sh staging)
    settings:
      base:
        PRODUCT_NAME: Reader
        PRODUCT_BUNDLE_IDENTIFIER: com.tirthajyoti.Reader
        APP_ICON_NAME: Reader          # → CFBundleIconFile ($(APP_ICON_NAME))
        MD_HANDLER_RANK: Default       # → markdown LSHandlerRank (prod is the default .md handler)
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Reader.entitlements
      configs:
        # Staging identity: separate bundle id / name / icon; Alternate handler rank
        # so staging never auto-steals the default .md association from production.
        Staging:
          PRODUCT_NAME: "Reader Canary"
          PRODUCT_BUNDLE_IDENTIFIER: com.tirthajyoti.Reader.staging
          APP_ICON_NAME: Reader-Staging
          MD_HANDLER_RANK: Alternate
    dependencies:
      - target: QuickLookExtension
        embed: true

  QuickLookExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLook
      - path: WebResources
        type: folder            # same renderer bundled into the .appex (no network in QL)
    settings:
      base:
        PRODUCT_NAME: QuickLookExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.tirthajyoti.Reader.QuickLook
        INFOPLIST_FILE: QuickLook/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: QuickLook/QuickLook.entitlements
      configs:
        # Staging appex id is a child of the staging app id → its own Quick Look
        # registration, no Launch Services collision with production's appex.
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: com.tirthajyoti.Reader.staging.QuickLook

  # Host-less logic tests for the pure model code (theming parse, custom-theme
  # security, palette/colour, relative-time). Compiles the self-contained source
  # files directly so no app launch is needed.
  ReaderModelTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: tests/Swift
      - path: App/Theming.swift
      - path: App/Theme.swift
    settings:
      base:
        PRODUCT_NAME: ReaderModelTests
        PRODUCT_BUNDLE_IDENTIFIER: com.tirthajyoti.Reader.ModelTests
        GENERATE_INFOPLIST_FILE: "YES"

  # Real-WebKit-engine render + export-snapshot harness. Loads reader.html into a
  # WKWebView inside an OFF-SCREEN window (never key/visible, never NSApp.activate),
  # so it's fully headless — no window, no focus theft. Covers the same engine Quick
  # Look/the app use, plus the takeSnapshot export path Chromium can't.
  ReaderRenderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: tests/SwiftRender
    settings:
      base:
        PRODUCT_NAME: ReaderRenderTests
        PRODUCT_BUNDLE_IDENTIFIER: com.tirthajyoti.Reader.RenderTests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  # ⌘R / Profile run the Staging identity (Reader Canary) so day-to-day dev never
  # touches production. `scripts/promote.sh` builds -configuration Release for prod.
  Reader:
    build:
      targets:
        Reader: all
    run:
      config: Staging
    profile:
      config: Staging
    archive:
      config: Release
  ReaderModelTests:
    build:
      targets:
        ReaderModelTests: all
    test:
      targets:
        - ReaderModelTests
  ReaderRenderTests:
    build:
      targets:
        ReaderRenderTests: all
    test:
      targets:
        - ReaderRenderTests
